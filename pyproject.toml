[project]
name = "picogym"
version = "0.0.5"
description = "small modular simulation environments"
authors = [
    {name = "Matthew Taylor", email = "matthew.taylor.andre@gmail.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = {Homepage = "https://github.com/MatthewAndreTaylor/picogym"}
keywords = ["jupyter", "simulation"]

dependencies = [
    "numpy",
    "anywidget",
    "jupyter-ui-poll"
]

[project.optional-dependencies]
warp = ["warp-lang==1.8.1"]
mujoco = ["mujoco"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["picogym", "picogym_warp", "picogym_mujoco"]
include-package-data = true

# TODO: move assets to separate package - example: picogym-{ext}-assets
[tool.setuptools.package-data]
picogym = ["**/*"]
picogym_warp = ["**/*"]
picogym_mujoco = ["**/*"]

[tool.setuptools.exclude-package-data]
picogym = ["**/*.png"]
picogym_warp = ["**/*.png"]
picogym_mujoco = ["**/*.png"]
